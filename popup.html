<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Water Tracker</title>
    <style>
      body {
        width: 240px;
        font-family: system-ui, sans-serif;
        padding: 12px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .label {
        font-size: 13px;
        color: #2a5f8f;
      }
      /* Toggle switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #ccc;
        transition: 0.2s;
        border-radius: 22px;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.2s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: #4a90d9;
      }
      input:checked + .slider::before {
        transform: translateX(18px);
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <h1>Water Tracker</h1>
    <div class="row">
      <span class="label">Tracking</span>
      <label class="switch">
        <input type="checkbox" id="enabled-toggle" />
        <span class="slider"></span>
      </label>
    </div>
    <div id="status">Loading…</div>
    <script src="popup.js"></script>
  </body>
</html>
